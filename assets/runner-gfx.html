<!doctype html>
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' blob:; style-src 'unsafe-inline'; connect-src 'none'; img-src data: blob:">
<style>
    html, body {
        margin: 0;
        height: 100%;
        background: #000;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
    }

    canvas {
        max-width: 100%;
        max-height: 100%;
        aspect-ratio: 8 / 5;
        image-rendering: pixelated;
        outline: none;
    }
</style>
<canvas id="c" width="640" height="400" tabindex="0"></canvas>
<script>const c = document.getElementById('c');

// Browser key -> Doom key code (doomkeys.h)
const MAP = {
    ArrowLeft: 0xac, ArrowUp: 0xad, ArrowRight: 0xae, ArrowDown: 0xaf,
    ControlLeft: 0xa3, ControlRight: 0xa3,        // fire
    Space: 32, Enter: 13, Escape: 27, Tab: 9, Backspace: 0x7f,
    ShiftLeft: 0xb6, ShiftRight: 0xb6,            // run
    AltLeft: 0xb8, AltRight: 0xb8,                // strafe modifier
    Comma: 0xa0, Period: 0xa1,                    // strafe left / right
};
const doomKey = e => MAP[e.code] ?? (e.key.length === 1 ? e.key.toLowerCase().charCodeAt(0) : null);

addEventListener('message', async e => {
    const { glue, wasm, factory, args } = e.data;
    const mod = {
        canvas: c, keyq: [],
        wasmBinary: wasm,
        arguments: args,
        print: () => {}, printErr: () => {},
    };
    for (const type of ['keydown', 'keyup']) {
        addEventListener(type, ev => {
            const k = doomKey(ev);
            if (k == null) return;
            ev.preventDefault();
            if (ev.repeat) return;
            mod.keyq.push(((type === 'keydown' ? 1 : 0) << 8) | k);
        });
    }
    addEventListener('mousedown', () => c.focus());
    c.focus();

    const s = document.createElement('script');
    s.src = URL.createObjectURL(new Blob([glue], { type: 'text/javascript' }));
    await new Promise((ok, bad) => { s.onload = ok; s.onerror = bad; document.head.appendChild(s); });
    await window[factory](mod);
});</script>
