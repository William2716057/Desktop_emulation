<!doctype html>
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' blob:; style-src 'unsafe-inline'; connect-src 'none'; img-src data: blob:">
<style>
    html, body {
        margin: 0;
        height: 100%;
        background: #000;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
    }

    canvas {
        max-width: 100%;
        max-height: 100%;
        aspect-ratio: 8 / 5;
        image-rendering: pixelated;
        outline: none;
    }

    #log {
        position: fixed;
        left: 6px;
        top: 6px;
        right: 6px;
        margin: 0;
        color: #0f0;
        font: 11px monospace;
        white-space: pre-wrap;
        pointer-events: none;
        max-height: 95%;
        overflow: hidden;
    }
</style>
<canvas id="c" width="640" height="400" tabindex="0"></canvas>
<pre id="log"></pre>
<script>
    const c = document.getElementById('c');
    const logEl = document.getElementById('log');
    const log = (t, bad) => { console[bad ? 'error' : 'log'](t); logEl.textContent += t + '\n'; };

    //addEventListener('error', e => log('ERROR: ' + e.message + ' @' + e.lineno, true));
    //addEventListener('unhandledrejection', e => log('REJECTED: ' + (e.reason && e.reason.stack || e.reason), true));

    const MAP = {
        ArrowLeft: 0xac, ArrowUp: 0xad, ArrowRight: 0xae, ArrowDown: 0xaf,
        ControlLeft: 0xa3, ControlRight: 0xa3,
        Space: 32, Enter: 13, Escape: 27, Tab: 9, Backspace: 0x7f,
        ShiftLeft: 0xb6, ShiftRight: 0xb6,
        AltLeft: 0xb8, AltRight: 0xb8,
        Comma: 0xa0, Period: 0xa1,
    };
    const doomKey = e => MAP[e.code] ?? (e.key.length === 1 ? e.key.toLowerCase().charCodeAt(0) : null);

    addEventListener('message', async e => {
        const { glue, wasm, data, factory, args } = e.data;       // wasm and data are defined only in here
        //log(`received: glue ${glue.length} chars, wasm ${wasm.byteLength} bytes, data ${data.byteLength} bytes`);

        // Serve doom.data from the bytes the parent sent; the CSP blocks real network requests
        const realFetch = window.fetch.bind(window);
        window.fetch = (url, opts) => {
            if (String(url).split('?')[0].endsWith('.data')) {
                //log('serving package: ' + url);
                return Promise.resolve(new Response(data, {
                    status: 200,
                    headers: { 'Content-Length': String(data.byteLength) },
                }));
            }
            return realFetch(url, opts);
        };

        const mod = {
            canvas: c, keyq: [],
            wasmBinary: wasm,
            arguments: args,
            //print: t => log(t),
            //printErr: t => log(t, true),
            getPreloadedPackage: () => data,
            instantiateWasm(imports, done) {
                WebAssembly.instantiate(wasm, imports)
                    .then(r => done(r.instance, r.module))
                    .catch(err => log('wasm instantiate failed: ' + err, true));
                return {};
            },
        };

        for (const type of ['keydown', 'keyup']) {
            addEventListener(type, ev => {
                const k = doomKey(ev);
                if (k == null) return;
                ev.preventDefault();
                if (ev.repeat) return;
                mod.keyq.push(((type === 'keydown' ? 1 : 0) << 8) | k);
            });
        }
        addEventListener('mousedown', () => c.focus());
        c.focus();

        const s = document.createElement('script');
        s.src = URL.createObjectURL(new Blob([glue], { type: 'text/javascript' }));
        await new Promise((ok, bad) => { s.onload = ok; s.onerror = () => bad(new Error('glue script failed to load')); document.head.appendChild(s); });
        //log('typeof ' + factory + ' = ' + typeof window[factory]);
        await window[factory](mod);
        //log('module started');
    });
</script>
